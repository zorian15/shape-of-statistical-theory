<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The likelihood factors into a theta-bearing piece that sees the data only through T, times a theta-free piece of the data alone.">
<text x="30.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">THE FISHER-NEYMAN FACTORIZATION</text>
<rect x="270" y="66" width="180" height="52" rx="10" fill="#ffffff" stroke="#cfcdc4" stroke-width="1.3"/>
<text x="360.0" y="91.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17181b">likelihood</text>
<text x="360.0" y="109.0" font-size="13" text-anchor="middle" fill="#6a6d73">p(x | θ)</text>
<text x="360.0" y="144.0" font-size="20" text-anchor="middle" fill="#3b3d42">=</text>
<path d="M 360.0 152.0 C 360.0 148.0 221.0 138.0 221.0 159.0" fill="none" stroke="#cfcdc4" stroke-width="1.3"/>
<path d="M 360.0 152.0 C 360.0 148.0 511.0 138.0 511.0 159.0" fill="none" stroke="#cfcdc4" stroke-width="1.3"/>
<rect x="96" y="162" width="250" height="96" rx="10" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.5"/>
<text x="221.0" y="194.0" font-size="17" font-weight="700" text-anchor="middle" fill="#17181b">g( T(x), θ )</text>
<text x="221.0" y="218.0" font-size="11.5" text-anchor="middle" fill="#3b3d42">θ touches the data</text>
<text x="221.0" y="235.0" font-size="11.5" text-anchor="middle" fill="#3b3d42">only through T</text>
<text x="221.0" y="280.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">keep this</text>
<text x="366.0" y="218.0" font-size="22" text-anchor="middle" fill="#6a6d73">&#215;</text>
<rect x="386" y="162" width="250" height="96" rx="10" fill="#ffffff" stroke="#cfcdc4" stroke-width="1.3"/>
<text x="511.0" y="194.0" font-size="17" font-weight="700" text-anchor="middle" fill="#6a6d73">h( x )</text>
<text x="511.0" y="218.0" font-size="11.5" text-anchor="middle" fill="#3b3d42">data alone,</text>
<text x="511.0" y="235.0" font-size="11.5" text-anchor="middle" fill="#3b3d42">free of θ</text>
<text x="511.0" y="280.0" font-size="12" font-weight="700" text-anchor="middle" fill="#6a6d73">discardable</text>
</svg>