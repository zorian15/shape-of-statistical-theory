<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Named distributions gathered under the exponential-family form, with the uniform and Cauchy marked as outside it.">
<text x="30.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">ONE FORM, MANY FACES</text>
<rect x="110" y="60" width="560" height="52" rx="10" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="390" y="92" font-size="16" text-anchor="middle" fill="#17181b">p(x&#160;|&#160;θ) = h(x)&#160;exp( η(θ)&#183;T(x) − A(θ) )</text>
<line x1="390" y1="112" x2="390" y2="155" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="150" y1="155" x2="630" y2="155" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="150" y1="155" x2="150" y2="185" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="150" y1="241" x2="150" y2="265" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="390" y1="155" x2="390" y2="185" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="390" y1="241" x2="390" y2="265" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="630" y1="155" x2="630" y2="185" stroke="#cfcdc4" stroke-width="1.4"/>
<line x1="630" y1="241" x2="630" y2="265" stroke="#cfcdc4" stroke-width="1.4"/>
<rect x="45.0" y="185.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="150.0" y="208.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Bernoulli</text>
<text x="150.0" y="227.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = x</text>
<rect x="285.0" y="185.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="390.0" y="208.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Poisson</text>
<text x="390.0" y="227.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = x</text>
<rect x="525.0" y="185.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="630.0" y="208.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Exponential</text>
<text x="630.0" y="227.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = x</text>
<rect x="45.0" y="265.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="150.0" y="288.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Normal</text>
<text x="150.0" y="307.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = (x, x²)</text>
<rect x="285.0" y="265.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="390.0" y="288.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Gamma</text>
<text x="390.0" y="307.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = (x, ln x)</text>
<rect x="525.0" y="265.0" width="210.0" height="56.0" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="630.0" y="288.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17181b">Beta</text>
<text x="630.0" y="307.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">T(x) = (ln x, ln(1−x))</text>
<rect x="110" y="360" width="560" height="70" rx="10" fill="none" stroke="#6a6d73" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="390" y="386" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3b3d42" letter-spacing="0.5">OUTSIDE THE FAMILY</text>
<text x="390" y="410" font-size="12.5" text-anchor="middle" fill="#6a6d73">Uniform on [0, θ] — support moves&#160;&#160;•&#160;&#160;Cauchy — tails too heavy</text>
</svg>