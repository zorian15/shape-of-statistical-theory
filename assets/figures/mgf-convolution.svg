<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Two lanes: convolving densities of X and Y to get the law of X + Y is hard, while multiplying their MGFs is easy; both reach the same law.">
<defs><marker id="mgfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3d42"/></marker></defs>
<text x="30.0" y="46.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">TWO LANES TO THE SAME LAW</text>
<text x="30.0" y="78.0" font-size="11" font-weight="700" fill="#274b6d" letter-spacing="1">DENSITIES</text>
<text x="30.0" y="232.0" font-size="11" font-weight="700" fill="#9c6b12" letter-spacing="1">MGFs</text>
<rect x="48.0" y="96.0" width="118.0" height="50.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="107.0" y="125.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">law of X</text>
<rect x="250.0" y="96.0" width="118.0" height="50.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="309.0" y="125.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">law of Y</text>
<text x="208.0" y="127.0" font-size="26" text-anchor="middle" font-weight="600" fill="#3b3d42">&#8859;</text>
<text x="208.0" y="147.0" font-size="9.5" text-anchor="middle" fill="#6a6d73">convolve</text>
<line x1="374.0" y1="121.0" x2="500.0" y2="121.0" stroke="#3b3d42" stroke-width="1.4" marker-end="url(#mgfArrow)"/>
<text x="438.0" y="113.0" font-size="9.5" text-anchor="middle" fill="#b04a3f" font-weight="600">needs an integral</text>
<rect x="508.0" y="96.0" width="168.0" height="50.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="592.0" y="125.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">law of X + Y</text>
<rect x="48.0" y="250.0" width="118.0" height="50.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="107.0" y="279.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">MGF of X</text>
<rect x="250.0" y="250.0" width="118.0" height="50.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="309.0" y="279.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">MGF of Y</text>
<text x="208.0" y="281.0" font-size="26" text-anchor="middle" font-weight="600" fill="#3b3d42">&#215;</text>
<text x="208.0" y="301.0" font-size="9.5" text-anchor="middle" fill="#6a6d73">multiply</text>
<line x1="374.0" y1="275.0" x2="500.0" y2="275.0" stroke="#3b3d42" stroke-width="1.4" marker-end="url(#mgfArrow)"/>
<text x="438.0" y="267.0" font-size="9.5" text-anchor="middle" fill="#274b6d" font-weight="600">just a product</text>
<rect x="508.0" y="250.0" width="168.0" height="50.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="592.0" y="279.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">MGF of X + Y</text>
<line x1="107.0" y1="150.0" x2="107.0" y2="246.0" stroke="#6a6d73" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="309.0" y1="150.0" x2="309.0" y2="246.0" stroke="#6a6d73" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="592.0" y1="150.0" x2="592.0" y2="246.0" stroke="#6a6d73" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="592.0" y="202.0" font-size="9.5" text-anchor="middle" fill="#6a6d73">same law</text>
</svg>