<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A single box on the left, one question about least risk under a model and loss, with arrows fanning to six named methods on the right.">
<defs><marker id="oq_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6d73"/></marker></defs>
<text x="28.0" y="36.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">ONE QUESTION, MANY METHODS</text>
<rect x="40" y="148" width="252" height="96" rx="10" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.4"/>
<text x="166.0" y="178.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#274b6d">One question</text>
<text x="166.0" y="198.0" font-size="11.5" text-anchor="middle" fill="#17181b">which procedure has the</text>
<text x="166.0" y="215.0" font-size="11.5" text-anchor="middle" fill="#17181b">least risk under a given</text>
<text x="166.0" y="232.0" font-size="11.5" text-anchor="middle" fill="#17181b">model and a given loss?</text>
<line x1="295.0" y1="196.0" x2="512.0" y2="48.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<line x1="295.0" y1="196.0" x2="512.0" y2="103.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<line x1="295.0" y1="196.0" x2="512.0" y2="158.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<line x1="295.0" y1="196.0" x2="512.0" y2="213.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<line x1="295.0" y1="196.0" x2="512.0" y2="268.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<line x1="295.0" y1="196.0" x2="512.0" y2="323.0" stroke="#6a6d73" stroke-width="1.3" marker-end="url(#oq_arrow)"/>
<rect x="516.0" y="28.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="52.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">maximum likelihood</text>
<rect x="516.0" y="83.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="107.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">ridge &amp; lasso</text>
<rect x="516.0" y="138.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="162.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">the t-test</text>
<rect x="516.0" y="193.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="217.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">confidence intervals</text>
<rect x="516.0" y="248.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="272.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">the bootstrap</text>
<rect x="516.0" y="303.0" width="214.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="623.0" y="327.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#17181b">Bayesian posteriors</text>
</svg>