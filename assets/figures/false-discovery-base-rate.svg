<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Base-rate flow showing false discoveries">
<text x="30.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">A 5% TEST ON A 10% BASE RATE</text>
<defs><marker id="fdr_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6d73"/></marker></defs>
<rect x="300.0" y="60.0" width="160.0" height="46.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="380.0" y="87.5" font-size="13" font-weight="600" text-anchor="middle" fill="#17181b">1000 hypotheses</text>
<rect x="130.0" y="168.0" width="200.0" height="46.0" rx="6" fill="#eaf0f6" stroke="#274b6d"/>
<text x="230.0" y="195.2" font-size="12" font-weight="600" text-anchor="middle" fill="#274b6d">100 real effects  (10%)</text>
<rect x="430.0" y="168.0" width="200.0" height="46.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="530.0" y="195.2" font-size="12" font-weight="600" text-anchor="middle" fill="#6a6d73">900 no effect</text>
<line x1="340.0" y1="106.0" x2="230.0" y2="168.0" stroke="#6a6d73" stroke-width="1.4" marker-end="url(#fdr_arrow)"/>
<line x1="420.0" y1="106.0" x2="530.0" y2="168.0" stroke="#6a6d73" stroke-width="1.4" marker-end="url(#fdr_arrow)"/>
<rect x="130.0" y="276.0" width="200.0" height="46.0" rx="6" fill="#eaf0f6" stroke="#274b6d"/>
<text x="230.0" y="303.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#274b6d">≈ 80 significant  (power 80%)</text>
<rect x="430.0" y="276.0" width="200.0" height="46.0" rx="6" fill="#fbe9e6" stroke="#b04a3f"/>
<text x="530.0" y="303.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b04a3f">≈ 45 significant  (α = 5%)</text>
<line x1="230.0" y1="214.0" x2="230.0" y2="276.0" stroke="#274b6d" stroke-width="1.4" marker-end="url(#fdr_arrow)"/>
<line x1="530.0" y1="214.0" x2="530.0" y2="276.0" stroke="#b04a3f" stroke-width="1.4" marker-end="url(#fdr_arrow)"/>
<text x="230.0" y="340.0" font-size="10.5" text-anchor="middle" fill="#274b6d">true positives</text>
<text x="530.0" y="340.0" font-size="10.5" text-anchor="middle" fill="#b04a3f">false positives</text>
<rect x="130.0" y="360.0" width="320.0" height="34" rx="4" fill="#274b6d"/>
<rect x="450.0" y="360.0" width="180.0" height="34" rx="4" fill="#b04a3f"/>
<text x="290.0" y="381.0" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">80 true</text>
<text x="540.0" y="381.0" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">45 false</text>
<text x="630.0" y="352.0" font-size="11.5" text-anchor="end" fill="#3b3d42" font-weight="600">125 significant results → 36% are false discoveries</text>
</svg>