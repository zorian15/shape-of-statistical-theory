<line x1="242" y1="462.0" x2="242" y2="490.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="481.0" font-size="14" font-weight="700" fill="#274b6d">Asymptotics</text>
<text x="258" y="481.0" font-size="12.5" fill="#3b3d42">the promises that hold as data grows</text>
</svg>