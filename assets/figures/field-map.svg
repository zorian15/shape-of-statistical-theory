<line x1="242" y1="384.0" x2="242" y2="412.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="403.0" font-size="14" font-weight="700" fill="#274b6d">Testing</text>
<text x="258" y="403.0" font-size="12.5" fill="#3b3d42">deciding between explanations under doubt</text>
<line x1="352.0" y1="427.0" x2="352.0" y2="447.0" stroke="#274b6d" stroke-width="1.8" marker-end="url(#fm_arrow)"/>
<circle cx="42" cy="476.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="480.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">VI</text>
