<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Six labeled rows, numbered I to VI, connected top to bottom by arrows: distributions, estimation, loss and risk, regularization, testing, asymptotics.">
<defs><marker id="fm_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<text x="30.0" y="36.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">THE MAP OF THE FIELD</text>
<circle cx="42" cy="86.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="90.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">I</text>
<rect x="74" y="60.0" width="556" height="52" rx="8" fill="#ffffff" stroke="#cfcdc4"/>
<line x1="242" y1="72.0" x2="242" y2="100.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="91.0" font-size="14" font-weight="700" fill="#274b6d">Distributions</text>
<text x="258" y="91.0" font-size="12.5" fill="#3b3d42">the language of randomness</text>
<line x1="352.0" y1="115.0" x2="352.0" y2="135.0" stroke="#274b6d" stroke-width="1.8" marker-end="url(#fm_arrow)"/>
<circle cx="42" cy="164.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="168.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">II</text>
<rect x="74" y="138.0" width="556" height="52" rx="8" fill="#ffffff" stroke="#cfcdc4"/>
<line x1="242" y1="150.0" x2="242" y2="178.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="169.0" font-size="14" font-weight="700" fill="#274b6d">Estimation</text>
<text x="258" y="169.0" font-size="12.5" fill="#3b3d42">guessing an unknown from data</text>
<line x1="352.0" y1="193.0" x2="352.0" y2="213.0" stroke="#274b6d" stroke-width="1.8" marker-end="url(#fm_arrow)"/>
<circle cx="42" cy="242.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="246.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">III</text>
<rect x="74" y="216.0" width="556" height="52" rx="8" fill="#ffffff" stroke="#cfcdc4"/>
<line x1="242" y1="228.0" x2="242" y2="256.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="247.0" font-size="14" font-weight="700" fill="#274b6d">Loss &amp; risk</text>
<text x="258" y="247.0" font-size="12.5" fill="#3b3d42">scoring a procedure before you see data</text>
<line x1="352.0" y1="271.0" x2="352.0" y2="291.0" stroke="#274b6d" stroke-width="1.8" marker-end="url(#fm_arrow)"/>
<circle cx="42" cy="320.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="324.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">IV</text>
<rect x="74" y="294.0" width="556" height="52" rx="8" fill="#ffffff" stroke="#cfcdc4"/>
<line x1="242" y1="306.0" x2="242" y2="334.0" stroke="#e4e3dd" stroke-width="1"/>
<text x="94" y="325.0" font-size="14" font-weight="700" fill="#274b6d">Regularization</text>
<text x="258" y="325.0" font-size="12.5" fill="#3b3d42">trading a little bias for less variance</text>
<line x1="352.0" y1="349.0" x2="352.0" y2="369.0" stroke="#274b6d" stroke-width="1.8" marker-end="url(#fm_arrow)"/>
<circle cx="42" cy="398.0" r="16" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.3"/>
<text x="42" y="402.0" font-size="12" font-weight="700" text-anchor="middle" fill="#274b6d">V</text>
