<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A right triangle from the origin: the true vector theta as one leg, perpendicular noise as the other, and the longer observed vector X as the hypotenuse, with X pulled back toward the center to land closer to theta.">
<text x="30.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">THE RAW ESTIMATE IS TOO LONG</text>
<defs><marker id="ov_pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6b12"/></marker></defs>
<circle cx="90.0" cy="350.0" r="5" fill="#17181b"/>
<text x="84.0" y="372.0" font-size="12" text-anchor="middle" fill="#3b3d42">center</text>
<line x1="90.0" y1="350.0" x2="430.0" y2="250.0" stroke="#274b6d" stroke-width="2.6"/>
<text x="254.0" y="326.0" font-size="14" font-style="italic" fill="#274b6d">true θ</text>
<circle cx="430.0" cy="250.0" r="5" fill="#274b6d"/>
<line x1="430.0" y1="250.0" x2="560.0" y2="90.0" stroke="#6a6d73" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="529.0" y="170.0" font-size="12.5" fill="#6a6d73">noise ⊥ θ</text>
<path d="M 414.7 254.5 L 424.7 242.1 L 440.1 237.6" fill="none" stroke="#6a6d73" stroke-width="1.2"/>
<line x1="90.0" y1="350.0" x2="560.0" y2="90.0" stroke="#b04a3f" stroke-width="2.6"/>
<circle cx="560.0" cy="90.0" r="5" fill="#b04a3f"/>
<text x="574.0" y="94.0" font-size="14" fill="#b04a3f">observed X</text>
<text x="285.0" y="212.0" font-size="12.5" fill="#b04a3f" transform="rotate(-25 285.0 212.0)">longer than θ</text>
<line x1="552.0" y1="96.0" x2="387.4" y2="184.8" stroke="#9c6b12" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#ov_pull)"/>
<circle cx="381.4" cy="188.8" r="5.5" fill="#9c6b12"/>
<text x="371.4" y="210.8" font-size="12.5" text-anchor="middle" fill="#9c6b12">shrunk</text>
<text x="30" y="410.0" font-size="12" fill="#3b3d42">Noise adds nearly ⊥ θ, so ‖X‖² ≈ ‖θ‖² + pσ² — the observed X runs longer than the truth.</text>
</svg>