<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A forward chain from truth to data to procedure to estimate, with a dashed arc labeled risk looping the evaluation back to the truth.">
<defs><marker id="twm_fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<defs><marker id="twm_back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6b12"/></marker></defs>
<text x="28.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">TWO MOVES, ONE SUBJECT</text>
<rect x="30.0" y="86.0" width="120.0" height="54.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="90.0" y="118.2" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">Truth</text>
<text x="90.0" y="160.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">unknown parameter</text>
<rect x="218.0" y="86.0" width="120.0" height="54.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="278.0" y="118.2" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">Data</text>
<text x="278.0" y="160.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">one sample</text>
<rect x="406.0" y="86.0" width="120.0" height="54.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="466.0" y="118.2" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">Procedure</text>
<text x="466.0" y="160.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">your rule</text>
<rect x="594.0" y="86.0" width="120.0" height="54.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="654.0" y="118.2" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">Estimate</text>
<text x="654.0" y="160.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">your guess</text>
<line x1="154.0" y1="113.0" x2="214.0" y2="113.0" stroke="#274b6d" stroke-width="2" marker-end="url(#twm_fwd)"/>
<text x="184.0" y="103.0" font-size="10.5" text-anchor="middle" fill="#3b3d42">sample</text>
<line x1="342.0" y1="113.0" x2="402.0" y2="113.0" stroke="#274b6d" stroke-width="2" marker-end="url(#twm_fwd)"/>
<text x="372.0" y="103.0" font-size="10.5" text-anchor="middle" fill="#3b3d42">compute</text>
<line x1="530.0" y1="113.0" x2="590.0" y2="113.0" stroke="#274b6d" stroke-width="2" marker-end="url(#twm_fwd)"/>
<text x="560.0" y="103.0" font-size="10.5" text-anchor="middle" fill="#3b3d42">read off</text>
<path d="M 654.0 140.0 C 654.0 252, 90.0 252, 90.0 142.0" fill="none" stroke="#9c6b12" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#twm_back)"/>
<text x="372.0" y="264" font-size="12" text-anchor="middle" fill="#9c6b12" font-weight="600">risk: average error over every dataset the truth could produce</text>
</svg>