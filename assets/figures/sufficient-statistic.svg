<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="An independent sample x-one through x-n collapsing into a single sufficient statistic, the sum of T over the sample.">
<text x="30.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">THE SAMPLE FUNNELS INTO ONE SUMMARY</text>
<defs><marker id="suff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cfcdc4"/></marker></defs>
<rect x="60" y="74" width="118" height="40" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="119.0" y="99.0" font-size="15" text-anchor="middle" fill="#17181b">x₁</text>
<path d="M 184.0 94.0 C 268.0 94.0 382.0 200.0 468.0 200.0" fill="none" stroke="#cfcdc4" stroke-width="1.4" marker-end="url(#suff-arrow)"/>
<rect x="60" y="122" width="118" height="40" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="119.0" y="147.0" font-size="15" text-anchor="middle" fill="#17181b">x₂</text>
<path d="M 184.0 142.0 C 268.0 142.0 382.0 200.0 468.0 200.0" fill="none" stroke="#cfcdc4" stroke-width="1.4" marker-end="url(#suff-arrow)"/>
<rect x="60" y="170" width="118" height="40" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="119.0" y="195.0" font-size="15" text-anchor="middle" fill="#17181b">x₃</text>
<path d="M 184.0 190.0 C 268.0 190.0 382.0 200.0 468.0 200.0" fill="none" stroke="#cfcdc4" stroke-width="1.4" marker-end="url(#suff-arrow)"/>
<text x="119.0" y="242.0" font-size="18" text-anchor="middle" fill="#6a6d73">⋮</text>
<rect x="60" y="262" width="118" height="40" rx="7" fill="#ffffff" stroke="#cfcdc4"/>
<text x="119.0" y="287.0" font-size="15" text-anchor="middle" fill="#17181b">xₙ</text>
<path d="M 184.0 282.0 C 268.0 282.0 382.0 200.0 468.0 200.0" fill="none" stroke="#cfcdc4" stroke-width="1.4" marker-end="url(#suff-arrow)"/>
<rect x="472" y="150" width="210" height="100" rx="10" fill="#eaf0f6" stroke="#274b6d" stroke-width="1.4"/>
<text x="577.0" y="184.0" font-size="16" font-weight="700" text-anchor="middle" fill="#17181b">T = Σᵢ T(xᵢ)</text>
<text x="577.0" y="208.0" font-size="11.5" text-anchor="middle" fill="#3b3d42">carries all of θ’s information</text>
<text x="577.0" y="228.0" font-size="11.5" text-anchor="middle" fill="#6a6d73">its size never grows with n</text>
</svg>